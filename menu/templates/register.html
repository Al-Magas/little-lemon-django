{% extends "base.html" %}
{% block content %}
<h2>Créer un compte</h2>

<form id="registerForm">
    <input type="text" id="username" placeholder="Nom d'utilisateur" required><br><br>
    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Mot de passe" required><br><br>
    <button type="submit">Créer le compte</button>
</form>

<p id="msg"></p>

<script>
document.getElementById("registerForm").onsubmit = async function(e){
    e.preventDefault();

    const response = await fetch("/api/register/", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            username: username.value,
            email: email.value,
            password: password.value
        })
    });

    const data = await response.json();

    if(response.ok){
        msg.innerText = "Compte créé avec succès !";
        window.location.href = "/login/"; // redirection vers login
    } else {
        msg.innerText = JSON.stringify(data);
    }
}
</script>
{% endblock %}

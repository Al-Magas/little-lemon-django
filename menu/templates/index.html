{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>
.menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
    margin: 50px ;
}

.menu-card {
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    transition: transform 0.2s;
}

.menu-card:hover {
    transform: scale(1.02);
}

.menu-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

.menu-body {
    padding: 15px;
}

.menu-body h3 {
    margin: 0;
    font-size: 18px;
}

.menu-price {
    color: #27ae60;
    font-weight: bold;
    float: right;
}
</style>

<div class="menu-grid">
    {% for item in menu.menu %}
    <div class="menu-card">
        <a href="{% url 'menu_item' pk=item.pk %}">
            {% if item.image %}
                <img src="{{ item.image.url }}" alt="{{ item.name }}">
            {% else %}
                <img src="{% static 'images/placeholder.jpg' %}" alt="Image non disponible">
            {% endif %}
        </a>

        <div class="menu-body">
            <h3>
                {{ item.name }}
                <span class="menu-price">${{ item.price }}.00</span>
            </h3>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}

{% load static %}

<footer>
    <style>
        footer {
            margin-top: 60px;
            padding: 20px;
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        footer img {
            height: 40px;
        }

        @media (max-width: 768px) {
            footer {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>

    <article>
        <img src="{% static 'img/Logo.svg' %}" alt="Logo Little-Lemon">
    </article>

    <article>
        <p>© {{ now|date:"Y" }} Little Lemon</p>
    </article>
</footer>
